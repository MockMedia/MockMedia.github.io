<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
     <div id="bulletin-board">
            <div class="post-it pink">
                <h2>Events</h2>
                <p>Art Festival November 20th</p>
            </div>

            <div class="post-it blue">
                <h2>Due</h2>
                <p>Brand Identity Guide -Jan 1</p>
            </div>

            <div class="post-it yellow">
                <h2>Inspiration</h2>
                <img src="images/mood.jpeg" alt="mood" width="150">
            </div>

            <div class="post-it purple">
                <h2>Goals</h2>
                <ul>
                    <li>Continue code learning</li>
                    <li>update portfolio</li>
                    <li>enter art contest</li>
                </ul>
            </div>

            <div class="post-it green">
                <h2>Challenge Myself<h2>
                <p>complete website early</p>
            </div>

            <div class="post-it teal">
                <h2>Note to self</h2>
                <p> Don't give up, you got this</p>
        </div>
    </body>
</html>
